<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Markdown 预览</title>

<!--
  预览区（QWebEngineView）的网页外壳。

  它负责三件事：
    1. 装修：MarkdownParser 只吐出 <h1>…</h1> 这样的"裸标签"，好不好看全靠这段 CSS。
    2. 通话：引入 Qt 自带的 qwebchannel.js，连上 C++ 注册的 syncBridge 对象。
    3. 对表：给 #content 的每个顶层子元素挂 data-line（源码行号，1 起算），
       让"预览里的位置"和"源码里的行"能互相换算。

  ⚠ 行号统一约定：**1 起算**（人类看的第几行），C++ 侧也一样。
-->

<style>
  /* ==========================================================================
     主题变量（5.7）
     --------------------------------------------------------------------------
     整个预览页的颜色都从这里取。于是"切主题"= 改 <html> 上的一个 data-theme
     属性（见下面的 applyTheme()），**不需要重新加载页面** —— 重载会闪一下白，
     还会让 WebChannel 重连，正是主题切换最不该有的体验。

     亮暗两套色值刻意和编辑器那边的 ThemePalette（C++）以及 resources/styles/*.qss
     保持一致的观感：同一个应用里，预览和编辑器不该像是两个软件。
     ========================================================================== */
  :root {
    /* 页面 */
    --bg: #ffffff;
    --fg: #24292f;
    --muted: #57606a;
    --border: #eaecef;
    --border-strong: #d0d7de;
    --stripe: #f6f8fa;
    --link: #0969da;
    --quote-bar: #d0d7de;
    --selection: #b6d7ff;
    /* 代码 */
    --code-bg: #f6f8fa;
    --code-fg: #24292f;
    --tok-comment: #6a737d;
    --tok-keyword: #d73a49;
    --tok-type: #6f42c1;
    --tok-literal: #005cc5;
    --tok-builtin: #005cc5;
    --tok-string: #032f62;
    --tok-number: #005cc5;
    --tok-function: #6f42c1;
    --tok-attr: #005cc5;
    --tok-tag: #22863a;
    --tok-operator: #d73a49;
    --tok-meta: #6a737d;
    --tok-add-fg: #22863a;
    --tok-add-bg: #f0fff4;
    --tok-del-fg: #b31d28;
    --tok-del-bg: #ffeef0;
  }

  html[data-theme="dark"] {
    --bg: #0d1117;
    --fg: #c9d1d9;
    --muted: #8b949e;
    --border: #21262d;
    --border-strong: #30363d;
    --stripe: #161b22;
    --link: #58a6ff;
    --quote-bar: #30363d;
    --selection: #1f6feb;
    --code-bg: #161b22;
    --code-fg: #c9d1d9;
    --tok-comment: #8b949e;
    --tok-keyword: #ff7b72;
    --tok-type: #d2a8ff;
    --tok-literal: #79c0ff;
    --tok-builtin: #79c0ff;
    --tok-string: #a5d6ff;
    --tok-number: #79c0ff;
    --tok-function: #d2a8ff;
    --tok-attr: #79c0ff;
    --tok-tag: #7ee787;
    --tok-operator: #ff7b72;
    --tok-meta: #8b949e;
    --tok-add-fg: #7ee787;
    --tok-add-bg: #12261e;
    --tok-del-fg: #ffa198;
    --tok-del-bg: #25171c;
  }

  /* ---------- 页面基础 ---------- */
  html, body { background: var(--bg); }
  body {
    margin: 0;
    padding: 28px 36px 60vh;      /* 底部留白：最后一段也能滚到顶部 */
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: 16px;
    line-height: 1.75;
    word-wrap: break-word;
  }

  ::selection { background: var(--selection); }

  /* 正文限宽：别让一行的文字横跨整个屏幕 */
  #content { max-width: 920px; margin: 0 auto; }

  /* ---------- 标题 ---------- */
  h1, h2, h3, h4, h5, h6 { font-weight: 600; line-height: 1.3; margin: 1.5em 0 .6em; }
  h1 { font-size: 1.9em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  h2 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  h3 { font-size: 1.2em; }
  h4 { font-size: 1.05em; }
  h5, h6 { font-size: 1em; color: var(--muted); }
  h1:first-child, h2:first-child { margin-top: 0; }

  p { margin: .8em 0; }

  /* ---------- 链接 ---------- */
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- 代码 ---------- */
  code, pre {
    font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
    font-size: .9em;
  }
  code { background: var(--code-bg); color: var(--code-fg); padding: .2em .4em; border-radius: 4px; }
  pre {
    background: var(--code-bg);
    color: var(--code-fg);
    padding: 14px 16px;
    border-radius: 6px;
    overflow: auto;              /* 长行横向滚动，不要撑破版面 */
  }
  pre code { background: none; padding: 0; }

  /* ---------- 代码高亮 ----------
     这些类名是 CodeHighlighter（C++）和这里 CSS 之间的契约：高亮器把代码切成
     <span class="hljs-xxx">，配色全在这里（用的是主题变量，所以亮暗一起切）。
     预览和导出的 HTML/PDF 用的是同一份样式（导出时会从本文件里抽这段 CSS）。 */
  .hljs-comment   { color: var(--tok-comment); font-style: italic; }
  .hljs-keyword   { color: var(--tok-keyword); }
  .hljs-type      { color: var(--tok-type); }
  .hljs-literal   { color: var(--tok-literal); }
  .hljs-built_in  { color: var(--tok-builtin); }
  .hljs-string    { color: var(--tok-string); }
  .hljs-number    { color: var(--tok-number); }
  .hljs-function  { color: var(--tok-function); }
  .hljs-attr      { color: var(--tok-attr); }
  .hljs-tag       { color: var(--tok-tag); }
  .hljs-operator  { color: var(--tok-operator); }
  .hljs-meta      { color: var(--tok-meta); font-style: italic; }
  .hljs-diff-add  { color: var(--tok-add-fg); background: var(--tok-add-bg); }
  .hljs-diff-del  { color: var(--tok-del-fg); background: var(--tok-del-bg); }

  /* ---------- 引用 ---------- */
  blockquote {
    margin: .8em 0;
    padding: 0 1em;
    color: var(--muted);
    border-left: .25em solid var(--quote-bar);
  }
  blockquote > :first-child { margin-top: 0; }
  blockquote > :last-child { margin-bottom: 0; }

  /* ---------- 列表（含 GFM 任务列表）---------- */
  ul, ol { padding-left: 2em; margin: .8em 0; }
  li + li { margin-top: .2em; }
  /* md4c 给任务列表项加了 class，去掉项目符号、让复选框顶到行首 */
  li.task-list-item { list-style: none; margin-left: -1.35em; }
  input[type="checkbox"] { margin-right: .4em; }

  /* ---------- 表格（GFM）---------- */
  table { border-collapse: collapse; margin: 1em 0; display: block; overflow: auto; }
  th, td { border: 1px solid var(--border-strong); padding: 6px 13px; }
  th { background: var(--stripe); font-weight: 600; }
  tbody tr:nth-child(2n) { background: var(--stripe); }

  /* ---------- 其它 ---------- */
  img { max-width: 100%; }
  hr { border: 0; border-top: 1px solid var(--border-strong); margin: 24px 0; }
</style>

<!-- Qt 自带的 WebChannel 客户端脚本。
     注意这个 qrc:/// 路径是 Qt 内置资源，任何页面都能取到，不需要你准备这个文件。 -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>

<body>
<div id="content"><!-- 渲染出来的 HTML 会塞进这里 --></div>

<script>
'use strict';

/* =========================================================================
   主题（5.7）
   -------------------------------------------------------------------------
   C++ 侧（ThemeManager → PreviewRenderer::applyTheme）会调用 applyTheme('dark')。
   它只做一件事：改 <html> 上的 data-theme 属性 —— 所有颜色都是 CSS 变量，
   浏览器立刻按新变量重绘。**不重新加载页面**，所以：
     * 不会闪一下白（重载才会）
     * 不会让 WebChannel 重连
     * 滚动位置、展开状态都不会丢
   ========================================================================= */
function applyTheme(name) {
    const theme = (name === 'dark') ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    console.log('主题已切换: ' + theme);
}

// 页面刚加载完时先用亮色兜底；C++ 侧加载完成后会立刻用真实主题覆盖一次
document.documentElement.setAttribute('data-theme', 'light');

/* =========================================================================
   与 C++ 的桥（QWebChannel）
   -------------------------------------------------------------------------
   C++ 侧对应的代码（MainWindow::initUi 里）：
       channel->registerObject("syncBridge", m_bridge);
   这里的 channel.objects.syncBridge 必须和那个字符串**一模一样**。
   ========================================================================= */
// 内容与块位置的缓存（P0-2 / P0-3）
// lastHtml：内容没变就跳过整棵 DOM 重建
// blockOffsets：每个顶层块的纵向位置，滚动时二分查找用（见 ensureBlockOffsets）
let lastHtml = null;
let blockOffsets = null;

// 尺寸或图片变化会改变块的高度 → 位置缓存失效
window.addEventListener('resize', function () {
    blockOffsets = null;
});
document.addEventListener('load', function (event) {
    if (event.target && event.target.tagName === 'IMG') {
        blockOffsets = null;
    }
}, true);
let bridge = null;

new QWebChannel(qt.webChannelTransport, function (channel) {
    bridge = channel.objects.syncBridge;
    if (!bridge) {
        console.error('WebChannel: 没有找到 syncBridge 对象（检查 registerObject 的名字）');
        return;
    }
    // C++ 的信号 → 用 JS 的 .connect() 连上。这就是"编辑器滚动 → 预览滚动"。
    // C++ 那边已经把一帧内的多次滚动合并过了（P0-2），这里再合并一层：
    // 用 requestAnimationFrame 保证"每个显示帧最多真正滚一次"。
    bridge.editorScrolled.connect(function (line) {
        requestScrollToLine(line);
    });
    console.log('WebChannel 已连接: syncBridge');
});

/* =========================================================================
   内容与行号映射
   ========================================================================= */

/**
 * 用新的 HTML 替换预览内容，并给每个顶层块挂上源码行号。
 * @param {string} html    MarkdownParser 渲染出的 HTML 片段
 * @param {number[]} blockLines  每个顶层块对应的源码行号（1 起算），与 DOM 顺序一一对应
 */
function applyContent(html, blockLines) {
    const content = document.getElementById('content');

    // 内容一字不差时**什么都不做**（P0-3 的轻量版，也是 P0-2 的一部分）：
    // 重建整棵子树会让整页重新布局/重绘、图片重新解码、滚动位置漂移。
    // 而"内容没变却推一次"在真实使用里很常见（撤销又改回来、主题切换、切标签回来）。
    if (lastHtml === html) {
        return;
    }
    lastHtml = html;

    content.innerHTML = html;

    const children = content.children;
    const count = Math.min(children.length, blockLines.length);

    for (let i = 0; i < count; i++) {
        children[i].setAttribute('data-line', blockLines[i]);
    }

    // 块的位置缓存失效：下次滚动时重新量一次（见 ensureBlockOffsets）
    blockOffsets = null;

    // 块数对不上时不要静默：这通常意味着 C++ 那边的"块扫描"和 md4c 的解析结果不一致，
    // 只影响没被标注的那几个块（点击它们会退回到最近一个已标注的块），不会整体错位。
    if (children.length !== blockLines.length) {
        console.warn('data-line 数量对不上: DOM=' + children.length + ' 源码=' + blockLines.length
                     + '，只标注了前 ' + count + ' 个块');
    }
}

/**
 * 量一次每个顶层块的纵向位置，缓存起来。
 *
 * 为什么要缓存：原来 scrollToLine() 每次都遍历所有块去读 data-line（O(块数)），
 * 然后 scrollIntoView() —— 那个调用会**强制同步布局**。滚动时每帧都这么干一次，
 * 文档一大就明显卡。现在改成：量一次（一次批量读取，只触发一次布局），
 * 之后滚动只做一次二分查找 + 一个 scrollTo 赋值。
 *
 * 失效时机：内容变了、窗口尺寸变了、图片加载完（图片会改变高度）。
 */
function ensureBlockOffsets() {
    if (blockOffsets !== null) {
        return blockOffsets;
    }

    const content = document.getElementById('content');
    const children = content.children;
    const offsets = [];
    const lines = [];

    // 从 content 的顶部算起（加上文档已滚动的距离才是绝对位置）
    const base = content.getBoundingClientRect().top + window.scrollY;
    for (let i = 0; i < children.length; i++) {
        const l = parseInt(children[i].getAttribute('data-line'), 10);
        if (isNaN(l)) {
            continue;   // 没标注的块不参与（点击会退回最近一个已标注块，行为一致）
        }
        offsets.push(children[i].getBoundingClientRect().top + window.scrollY - base);
        lines.push(l);
    }

    blockOffsets = { offsets: offsets, lines: lines, base: base };
    return blockOffsets;
}

/**
 * 滚动预览，让"第 line 行"对应的块出现在顶部附近。
 * 由 C++ 的 editorScrolled(line) 信号触发，也可以手动调用调试。
 * @param {number} line 源码行号（1 起算）
 */
function scrollToLine(line) {
    const cache = ensureBlockOffsets();
    if (cache.lines.length === 0) {
        window.scrollTo(0, 0);
        return;
    }

    // 二分查找：最后一个 data-line <= line 的块（data-line 是递增的）
    let low = 0;
    let high = cache.lines.length - 1;
    let found = -1;
    while (low <= high) {
        const mid = (low + high) >> 1;
        if (cache.lines[mid] <= line) {
            found = mid;
            low = mid + 1;
        } else {
            high = mid - 1;
        }
    }

    if (found < 0) {
        window.scrollTo(0, 0);   // 目标行在第一个块之前 → 回到顶部
        return;
    }

    // 直接用 scrollTop 赋值，而不是 scrollIntoView：
    // scrollIntoView 会强制浏览器立刻做一次布局（滚动时每帧一次就变成性能杀手）。
    window.scrollTo(0, cache.base + cache.offsets[found]);
}

/**
 * 把一帧内的多次滚动合并成一次真正的滚动（P0-2）。
 * C++ 侧已经合并过一层，这里再按显示帧合并一层：连续滚动时每帧最多滚一次。
 */
let pendingScrollLine = null;
let scrollFrameScheduled = false;

/* =========================================================================
   帧统计（性能排查）
   -------------------------------------------------------------------------
   和 C++ 侧（EditorWidget 里的 FrameProbe）配成一对：那边量"编辑区重绘"，
   这边量"网页自己的帧间隔"。两个数字一对比，就知道掉帧发生在哪一侧 ——
   是 Qt 编辑器重绘慢，还是 Chromium 在软件合成。

   只在滚动期间采样（停手 300ms 报一次然后停下），不用常驻 rAF 循环：
   常驻 rAF 本身会让合成器一直忙碌，那会污染测量结果，也白耗电。
   ========================================================================= */
const frameProbe = {
    frames: 0,
    worst: 0,
    last: 0,
    running: false,
    timer: null,

    start: function () {
        if (this.running) {
            return;
        }
        this.frames = 0;
        this.worst = 0;
        this.last = 0;
        this.running = true;
        const self = this;
        const tick = function (now) {
            if (!self.running) {
                return;
            }
            if (self.last > 0) {
                const gap = now - self.last;
                if (gap > self.worst) {
                    self.worst = gap;
                }
            }
            self.last = now;
            self.frames++;
            requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        this.armStop();
    },

    armStop: function () {
        const self = this;
        if (this.timer !== null) {
            clearTimeout(this.timer);
        }
        this.timer = setTimeout(function () { self.stop(); }, 300);
    },

    stop: function () {
        if (!this.running) {
            return;
        }
        this.running = false;

        // 报给 C++（QWebChannel）。bridge 还没连上就算了 —— 这点统计不值得排队等。
        if (bridge && bridge.reportPreviewFrames && this.frames >= 3) {
            bridge.reportPreviewFrames(this.frames, Math.round(this.worst));
        }
        this.frames = 0;
    }
};

window.addEventListener('scroll', function () {
    frameProbe.start();
    frameProbe.armStop();
}, { passive: true });

function requestScrollToLine(line) {
    pendingScrollLine = line;
    if (scrollFrameScheduled) {
        return;
    }
    scrollFrameScheduled = true;

    const run = function () {
        scrollFrameScheduled = false;
        if (pendingScrollLine === null) {
            return;
        }
        const target = pendingScrollLine;
        pendingScrollLine = null;
        scrollToLine(target);
    };

    if (typeof requestAnimationFrame === 'function') {
        requestAnimationFrame(run);
    } else {
        setTimeout(run, 16);   // 极老的引擎兜底
    }
}

/**
 * 反查：屏幕上这个坐标属于源码第几行。
 * @param {number} x  clientX
 * @param {number} y  clientY
 * @returns {number|null} 行号（1 起算）；实在找不到返回 null
 */
function getLineAtPosition(x, y) {
    let el = document.elementFromPoint(x, y);
    if (!el) {
        return null;
    }

    // 先沿着祖先往上找带 data-line 的（正常情况一步就能命中）
    const content = document.getElementById('content');
    for (let node = el; node && node !== content; node = node.parentElement) {
        const line = parseInt(node.getAttribute && node.getAttribute('data-line'), 10);
        if (!isNaN(line)) {
            return line;
        }
    }

    // 没标注（比如块数对不上时多出来的块）：退回到"前面最近的一个已标注块"，
    // 这样点击至少能跳到附近，而不是完全没反应
    let sibling = el;
    while (sibling && sibling !== content) {
        for (let prev = sibling.previousElementSibling; prev; prev = prev.previousElementSibling) {
            const line = parseInt(prev.getAttribute('data-line'), 10);
            if (!isNaN(line)) {
                return line;
            }
        }
        sibling = sibling.parentElement;
    }

    return null;
}

/* =========================================================================
   事件：点击预览 → 让 C++ 把编辑器光标跳过去
   ========================================================================= */
document.addEventListener('click', function (event) {
    const line = getLineAtPosition(event.clientX, event.clientY);
    if (line === null) {
        return;
    }

    // 链接先不要真的跳走（否则预览页面就离开这份文档了）。
    // 以后想让链接打开系统浏览器，可以在 C++ 侧接一个 openLink(url) 方法。
    if (event.target.closest('a')) {
        event.preventDefault();
    }

    if (bridge) {
        bridge.reportPreviewClick(line);
    }
});
</script>
</body>
</html>
